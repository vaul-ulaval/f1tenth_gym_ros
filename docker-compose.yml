services:
  sim:
    image: f1tenth_gym_ros
    build: ./
    volumes: 
      - .:/sim_ws/src/f1tenth_gym_ros
    entrypoint: bash -c "source /opt/ros/humble/setup.bash && source /sim_ws/install/local_setup.bash && ros2 launch f1tenth_gym_ros gym_bridge_launch.py"
    ports:
      - 8765:8765 # Foxglove